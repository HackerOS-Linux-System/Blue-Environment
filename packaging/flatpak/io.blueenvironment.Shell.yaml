# Flatpak manifest — packages Blue Software (the app-store/package-manager
# app) as a sandboxed Flatpak, NOT the compositor/session itself.
#
# This is a deliberate scope decision: Flatpak's sandbox model assumes an
# app runs *inside* an existing desktop session and talks to the host via
# portals — it isn't a fit for the compositor process itself, which needs
# raw DRM/KMS/libinput/seat access to be the session in the first place.
# Flatpak-packaging individual Blue-branded apps (Blue Software, Blue
# Translate, Blue Mail, etc.) so they're installable/updatable independent
# of the host distro's package manager is the realistic use case, and this
# manifest is a template for that — currently wired for Blue Software only.
app-id: io.blueenvironment.Software
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: blue-software
finish-args:
  - --share=network       # package metadata / downloads
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.PackageKit
modules:
  - name: blue-software
    buildsystem: simple
    build-commands:
      - install -Dm755 blue-software /app/bin/blue-software
      - install -Dm644 io.blueenvironment.Software.desktop /app/share/applications/io.blueenvironment.Software.desktop
      - install -Dm644 io.blueenvironment.Software.metainfo.xml /app/share/metainfo/io.blueenvironment.Software.metainfo.xml
    sources:
      - type: dir
        path: ../../src-tauri/target/release
