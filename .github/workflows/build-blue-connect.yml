name: Build Blue Connect

# Builds + tests the Blue Connect clients for Android and Windows:
#   Android (Kotlin)  → Blue-Connect-android*.apk
#   Windows (C#)      → Blue-Connect-windows-x64.zip (self-contained, single exe)
# The Apple clients (macOS .app + production iOS .ipa) live in build-blue-connect-macos.yml.
#
# Triggers: changes under src/lib/components/apps/Blue-Connect/{android,windows},
# manual run, and tags named  blue-connect-vX.Y.Z  — a tag also publishes a GitHub Release
# with these downloads attached (the Apple workflow attaches its own files to the same release).
#
# Optional repository secrets for a signed, installable release APK (without them the
# release contains the debug-signed APK, which installs fine for sideloading):
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file     (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main, master]
    paths:
      - 'src/lib/components/apps/Blue-Connect/android/**'
      - 'src/lib/components/apps/Blue-Connect/windows/**'
      - '.github/workflows/build-blue-connect.yml'
    tags: ['blue-connect-v*']
  pull_request:
    paths:
      - 'src/lib/components/apps/Blue-Connect/android/**'
      - 'src/lib/components/apps/Blue-Connect/windows/**'
      - '.github/workflows/build-blue-connect.yml'
  workflow_dispatch:

concurrency:
  group: build-blue-connect-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────── Android ─────────────────────────────
  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: src/lib/components/apps/Blue-Connect/android
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" == refs/tags/blue-connect-v* ]]; then v="${GITHUB_REF#refs/tags/blue-connect-v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests + debug APK
        env:
          BC_VERSION_NAME: ${{ steps.ver.outputs.version }}
          BC_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          BC_VERSION_NAME: ${{ steps.ver.outputs.version }}
          BC_VERSION_CODE: ${{ github.run_number }}
          BC_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          BC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/Blue-Connect-android-debug.apk"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/Blue-Connect-android.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/Blue-Connect-android.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: blue-connect-android
          path: out/*.apk
          if-no-files-found: error

  # ───────────────────────────── Windows ─────────────────────────────
  windows:
    name: Windows (C#)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: src/lib/components/apps/Blue-Connect/windows
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        working-directory: .
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/blue-connect-v*') { $v = $env:GITHUB_REF -replace '^refs/tags/blue-connect-v','' } else { $v = "0.0.0-dev.$($env:GITHUB_RUN_NUMBER)" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Protocol core: unit tests + two real nodes pairing over loopback with mutual TLS.
      - name: Self-test (protocol core)
        run: dotnet run --project BlueConnect.SelfTest -c Release

      - name: Publish (win-x64, self-contained, single file)
        run: >
          dotnet publish BlueConnect.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Zip
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/out" | Out-Null
          Compress-Archive -Path publish/BlueConnect.exe -DestinationPath "$env:GITHUB_WORKSPACE/out/Blue-Connect-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: blue-connect-windows
          path: out/Blue-Connect-windows-x64.zip
          if-no-files-found: error

  # ───────────────────────────── Release ─────────────────────────────
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/blue-connect-v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Blue Connect ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Blue-Connect-android.apk
            dist/Blue-Connect-windows-x64.zip
