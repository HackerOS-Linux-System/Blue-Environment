name: Build (release)

# Full release build. This is intentionally heavier than test.yml (release
# mode, multiple architectures) so it only runs on demand, on tags, and
# nightly — not on every push/PR. See test.yml for the fast
# check/lint/unit-test workflow that does run on every push/PR.
#
# ── Why this doesn't call a `build.rb`/Ruby packaging script ───────────
# An earlier version of this file shelled out to `ruby build.rb ...` for
# every job, and separately expected a `compositor/` directory to exist
# and be built alongside the Tauri shell. Neither `build.rb` nor
# `compositor/` exists anywhere in this repository — the Wayland
# compositor described in README.md hasn't landed in the tree yet, and
# no such Ruby script was ever added either, so every single job in that
# version of this file was unrunnable from a fresh checkout.
#
# This version depends on neither. `src-tauri/tauri.conf.json` already
# sets `"bundle": { "targets": "all" }`, which means Tauri's own,
# already-a-dependency bundler (`tauri build`, i.e. `npm run build:tauri`)
# produces every packaging format it can for the host platform on its
# own — on Linux that's `.deb`, `.rpm`, and `.AppImage`, with zero extra
# tooling beyond what `cargo`/`tauri-cli` already pull in. There is
# nothing here for a future `compositor/` addition to unblock — if/when
# it lands, it would be its own additional build step (and its own
# artifact), not a prerequisite this workflow is currently missing.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *' # nightly
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch/tag/sha)'
        required: false
        default: ''
      arch:
        description: >-
          Target architecture. Default x86_64. Pick ONE architecture, or
          "all" for all four. x86_64 and aarch64 build natively on GitHub's
          own runners (full bundles: .deb/.rpm/.AppImage). armv7 and riscv64
          have no GitHub runners, so they are built under QEMU emulation
          (binary + tar.gz only, much slower — expect hours). Tag pushes and
          the nightly schedule always build x86_64 only.
        required: false
        type: choice
        default: 'x86_64'
        options:
          - x86_64
          - aarch64
          - armv7
          - riscv64
          - all
      build_mode:
        description: >-
          "all" runs `tauri build` (full bundle set: .deb/.rpm/.AppImage
          plus the raw binary) — the default, and always what tag
          pushes/nightly get. "binary" does a plain `cargo build --release`
          and skips bundling (quick "does it still build" check). Only
          applies to x86_64/aarch64; armv7/riscv64 are always binary-only.
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - binary

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Resolves the "All" vs "Binary" choice above into a single
  # `binary_only` boolean the build job reads via
  # `needs.resolve-mode.outputs.binary_only` — computed once here rather
  # than re-deriving the same "is this a manual run AND did it ask for
  # Binary" expression independently in more than one place.
  # ──────────────────────────────────────────────────────────────────────
  resolve-mode:
    name: Resolve build mode and architectures
    runs-on: ubuntu-latest
    outputs:
      binary_only: ${{ steps.resolve.outputs.binary_only }}
      native_matrix: ${{ steps.resolve.outputs.native_matrix }}
      emulated_matrix: ${{ steps.resolve.outputs.emulated_matrix }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          IN_ARCH: ${{ inputs.arch }}
          IN_MODE: ${{ inputs.build_mode }}
        run: |
          set -e
          arch="x86_64"
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$IN_ARCH" ]; then arch="$IN_ARCH"; fi
          case "$arch" in
            all)            native='["x86_64","aarch64"]'; emulated='["armv7","riscv64"]' ;;
            x86_64|aarch64) native="[\"$arch\"]";          emulated='[]' ;;
            armv7|riscv64)  native='[]';                     emulated="[\"$arch\"]" ;;
            *) echo "Unknown arch: $arch" >&2; exit 1 ;;
          esac
          echo "native_matrix=$native"     >> "$GITHUB_OUTPUT"
          echo "emulated_matrix=$emulated" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_MODE" = "binary" ]; then
            echo "binary_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "binary_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building: native=$native emulated=$emulated"

  # ──────────────────────────────────────────────────────────────────────
  # Native builds (x86_64 + aarch64) — one matrix entry per SELECTED
  # architecture (see the `arch` input above); skipped when only an
  # emulated architecture was selected.
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }}, ${{ needs.resolve-mode.outputs.binary_only == 'true' && 'binary' || 'all' }})
    needs: resolve-mode
    if: needs.resolve-mode.outputs.native_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve-mode.outputs.native_matrix) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install system dependencies (Tauri v2 Linux build/bundle deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libudev-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Bust every existing cache under the old prefix. The exact
          # symptom this fixes: a "full match" cache restore of a
          # `target/` built from an OLDER commit — one before two new
          # `#[tauri::command]` functions (`backend_check_integration`,
          # `backend_repair_integration`) existed — was being reused for
          # a NEWER commit that references them, because this cache
          # key's own components (matrix arch + binary-only flag) never
          # change between commits, and Swatinem/rust-cache's automatic
          # hash is based on Cargo.lock/Cargo.toml + toolchain version,
          # not on this repo's actual `.rs` source (this repo also has
          # no committed Cargo.lock — see the root .gitignore — so that
          # part of the automatic hash couldn't help distinguish commits
          # either). Cargo's own fingerprinting normally recompiles a
          # changed crate regardless, and the log shows it correctly
          # deciding to recompile `blue-environment` — but the still-odd
          # end result was rustc reporting `#[tauri::command]`'s
          # generated `__cmd__backend_check_integration` /
          # `__tauri_command_name_backend_check_integration` helper
          # items as simply missing, for exactly the two newest command
          # functions and no others, identically on two independent
          # runners (x86_64 and aarch64) in the same run. Bumping
          # `prefix-key` (rust-cache's own documented mechanism for
          # "start a new cache manually") forces every job to build with
          # a genuinely empty cache once, discarding whatever the old
          # `v0-rust-...` cache entries were holding, which is the
          # direct, immediate fix for a poisoned/incorrectly-reused
          # cache regardless of the exact underlying trigger. Bump this
          # again (v3, v4, …) if a change ever needs to force a clean
          # cache in the future.
          prefix-key: "v1-rust"
          # `src-tauri` and `auth` are members of ONE cargo workspace
          # rooted at the repo root (see root Cargo.toml's
          # `[workspace] members`), so the actual build output — and
          # therefore what's worth caching — lives at `./target`, not
          # `./src-tauri/target`. This must stay in sync with the paths
          # used below ("Stage a generic portable tarball" etc.), which
          # hit exactly this mismatch before.
          workspaces: . -> target
          key: ${{ matrix.arch }}-${{ needs.resolve-mode.outputs.binary_only }}

      - name: npm install
        # `npm ci` requires a committed package-lock.json, which this
        # repo doesn't have; falling back to `npm install` (an unpinned,
        # slightly slower resolve) rather than failing the whole build
        # over a missing lockfile. Committing package-lock.json and
        # switching this back to `npm ci` is a worthwhile follow-up for
        # reproducible CI installs, just outside this workflow's scope.
        run: npm install

      - name: Build (All — full tauri bundle)
        if: needs.resolve-mode.outputs.binary_only == 'false'
        run: npm run build:tauri

      - name: Build frontend only (Binary mode)
        if: needs.resolve-mode.outputs.binary_only == 'true'
        # Mirrors tauri.conf.json's own `beforeBuildCommand` — normally
        # `tauri build` runs this step itself, but Binary mode skips
        # `tauri build` entirely (going straight to `cargo build`) so it
        # has to do this part by hand instead.
        run: |
          mkdir -p src-tauri/icons
          cp images/icon.png src-tauri/icons/icon.png
          npm run build

      - name: Build binary only (Binary mode)
        if: needs.resolve-mode.outputs.binary_only == 'true'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Stage a generic portable tarball
        run: |
          set -e
          # Binary lands in the *workspace* root's target/ (see this
          # repo's root Cargo.toml — [workspace] members = ["src-tauri",
          # "auth"]), not src-tauri/target/. Cargo always resolves the
          # target directory relative to the workspace root once a
          # crate is a workspace member, regardless of --manifest-path
          # pointing at the member crate itself — an earlier revision
          # of this file got that backwards and every job failed at
          # this exact step as a result.
          stage="dist-stage/blue-environment-${{ matrix.arch }}"
          mkdir -p "$stage"
          cp target/release/blue-environment "$stage/"
          cp images/icon.png "$stage/icon.png" 2>/dev/null || true
          mkdir -p dist-stage
          tar -C dist-stage -czf "dist-stage/blue-environment-${{ matrix.arch }}.tar.gz" "blue-environment-${{ matrix.arch }}"

      - name: Collect bundle outputs (All mode only)
        if: needs.resolve-mode.outputs.binary_only == 'false'
        run: |
          mkdir -p dist-stage/bundle
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist-stage/bundle/ \; || true
          ls -la dist-stage/bundle || echo "No bundle files found — check tauri.conf.json's bundle.targets and this job's log above for bundler errors."

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}-${{ needs.resolve-mode.outputs.binary_only == 'true' && 'binary' || 'all' }}
          path: |
            target/release/blue-environment
            dist-stage/blue-environment-${{ matrix.arch }}.tar.gz
            dist-stage/bundle/*
          if-no-files-found: warn
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  # Emulated builds (armv7, riscv64) — GitHub has no runners for these, so
  # the Rust binary is compiled inside a QEMU-emulated Ubuntu 22.04
  # container (uraimo/run-on-arch-action). The frontend is built ONCE on the
  # fast x86_64 host and only `cargo build` runs under emulation; the output
  # is the raw binary + tar.gz (no .deb/.rpm/.AppImage — the bundlers aren't
  # worth running under emulation). Slow by nature: the job allows up to 6h.
  # ──────────────────────────────────────────────────────────────────────
  build-emulated:
    name: Build (${{ matrix.arch }}, emulated binary)
    needs: resolve-mode
    if: needs.resolve-mode.outputs.emulated_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve-mode.outputs.emulated_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend on the host (architecture-independent)
        run: |
          mkdir -p src-tauri/icons
          cp images/icon.png src-tauri/icons/icon.png
          npm install
          npm run build

      - name: Compile the Rust shell under QEMU (${{ matrix.arch }})
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          dockerRunArgs: --volume "${PWD}:/work"
          install: |
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl build-essential pkg-config file git \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libssl-dev libudev-dev
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            cd /work
            cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Stage a generic portable tarball
        run: |
          set -e
          stage="dist-stage/blue-environment-${{ matrix.arch }}"
          mkdir -p "$stage"
          cp target/release/blue-environment "$stage/"
          cp images/icon.png "$stage/icon.png" 2>/dev/null || true
          tar -C dist-stage -czf "dist-stage/blue-environment-${{ matrix.arch }}.tar.gz" "blue-environment-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}-binary
          path: |
            target/release/blue-environment
            dist-stage/blue-environment-${{ matrix.arch }}.tar.gz
          if-no-files-found: warn
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  # Full source-tree zip — every file at the built ref, unmodified and
  # newly-added alike, as a single downloadable archive. Independent of
  # the All/Binary choice above (a source snapshot isn't a build
  # artifact in the same sense the binaries/bundles are) and independent
  # of the `build` job too, so this job's own runtime doesn't grow if
  # that one gets slower — it just archives what `actions/checkout`
  # already gave it.
  #
  # `git archive` (not a plain `zip -r .`) deliberately produces exactly
  # what's tracked in git at this ref — no `.git/` internals, no
  # `node_modules`/`target` build output some earlier step in this same
  # workflow run might have left lying around in the runner's workspace,
  # and no stray local-only files. That's what "unmodified and expanded
  # files" both mean here in practice: this is the literal repository
  # contents, not a filtered subset and not a rebuilt/regenerated one.
  # ──────────────────────────────────────────────────────────────────────
  package-source-zip:
    name: Package full source .zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Archive tracked source tree
        run: |
          set -e
          name="blue-environment-source-${{ github.ref_name }}.zip"
          git archive --format=zip --output="$name" HEAD
          mkdir -p dist
          mv "$name" "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: dist/*.zip
          retention-days: 14

  release:
    name: Attach artifacts to GitHub Release
    # `build`/`build-emulated` may be legitimately skipped (only the selected
    # architectures run), so the default "all needs succeeded" check is
    # replaced by "nothing failed or was cancelled".
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, build-emulated, package-source-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} out/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
