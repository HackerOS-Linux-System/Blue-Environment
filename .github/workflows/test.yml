name: Test

# Runs on every push/PR. This is deliberately the *fast* workflow: type
# checking, linting, `cargo check`/`clippy`, and unit tests only — no full
# release builds and no packaging. See build.yml for the exhaustive
# per-target build/package matrix, which is much slower and only makes
# sense to run less aggressively (see its own triggers).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep CI reasonably fast/cheap; bump if a job needs more.
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend — typecheck & lint (Svelte/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: svelte-check (typecheck)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: vite build (frontend only, no Tauri binary)
        run: npm run build -- --mode production
        env:
          # vite build without the Tauri backend doesn't need real
          # secrets/config; this just verifies the bundle compiles.
          VITE_CI: '1'

  tauri-allowlist-drift:
    name: Tauri allowlist — check build.rs/capabilities match main.rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # See scripts/gen-tauri-allowlist.mjs's module doc: build.rs's
      # command list and capabilities/default.json's allow-<command>
      # permissions are generated from main.rs's generate_handler![...]
      # list, not hand-maintained. This is exactly the class of bug that
      # made Settings > Screen Time silently record nothing — a command
      # registered in main.rs but missing from capabilities/default.json
      # is denied by Tauri's ACL at the IPC layer, with no compile-time
      # error and (depending on the call site) no visible runtime error
      # either. Fail CI immediately if the generated files and main.rs
      # ever drift apart again.
      - name: Check for drift
        run: node scripts/gen-tauri-allowlist.mjs --check

  i18n-key-check:
    name: i18n — every locale has every key english.ts has
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --check : every locale must have every english.ts key (and none extra).
      # --ratchet: the number of keys that still carry an English placeholder
      #            (`FIXME i18n`) may never grow beyond scripts/i18n-baseline.json.
      #            Translate new keys instead of leaving placeholders, then run
      #            `node scripts/check-i18n-keys.mjs --report-only --update-baseline`.
      - name: Check translation key parity and the untranslated-keys ratchet
        run: node scripts/check-i18n-keys.mjs --check --ratchet

  shell-backend-check:
    name: Shell backend (src-tauri) — cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri v2 Linux build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # src-tauri is a member of the root Cargo.toml's workspace —
          # actual build output lands in the workspace root's ./target,
          # not ./src-tauri/target (unlike compositor above, which is a
          # genuinely separate, standalone crate).
          workspaces: . -> target

      # Optional runtime tools the new features shell out to. Installing them lets
      # the integration-style tests run for real (rsync round trip, poppler, …);
      # each of those tests skips itself when its tool is missing.
      - name: Install optional tools used by tests
        run: sudo apt-get install -y rsync poppler-utils xz-utils

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  auth-check:
    name: auth (pattern-lock crate) — cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Same workspace as shell-backend-check above (auth is also a
          # root-workspace member) — this job builds `auth` on its own,
          # but it's still the same shared `./target` at the repo root.
          workspaces: . -> target

      - name: cargo check
        run: cargo check --manifest-path auth/Cargo.toml --all-targets

      - name: cargo test
        run: cargo test --manifest-path auth/Cargo.toml

  blue-lock-check:
    name: blue-lock — cargo check (if present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether blue-lock exists yet
        id: probe
        run: |
          if [ -f "blue-lock/Cargo.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.probe.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libpam0g-dev

      - name: Install Rust toolchain
        if: steps.probe.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        if: steps.probe.outputs.present == 'true'
        run: cargo check --manifest-path blue-lock/Cargo.toml --all-targets
